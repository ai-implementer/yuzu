# yuzu-cli のリリースバイナリをビルドし GitHub Release へ添付する（Phase 37）。
# v* タグ push で 4 プラットフォームをビルドし、draft Release に集約 →
# SHA256SUMS 添付後に公開する。アーカイブには第三者ライセンスの通知
# （THIRD-PARTY-LICENSES。licenses ジョブが生成。Phase 81）も入れる。テストは回さない（main の CI を信頼し、
# 代わりに「タグが main に含まれる」「タグとバージョンの一致」「--version smoke」で担保）。
# 部分失敗は Actions の「Re-run failed jobs」だけで復旧できる（--clobber で上書き・
# 公開まで draft のため外部には見えない）。
# actions はフルコミット SHA でピン留めする（タグの書き換えによる改ざんを防ぐ）。
# 更新時は SHA とコメントのバージョンを揃えること
name: release

on:
  push:
    tags: ["v*"]
  # ビルド matrix の検証用（Release は作らず build〜smoke〜アーカイブまで）
  workflow_dispatch:

permissions:
  contents: write # gh release create/upload/edit に必要

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # タグの正当性を検証し draft Release を用意する（存在チェック付き = 再実行安全）
  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 全ブランチ・全履歴（main 包含の検証と直前タグの取得に必要）
          fetch-depth: 0
      - name: タグ整合の検証
        run: |
          VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "タグ $GITHUB_REF_NAME と workspace バージョン $VERSION が不一致（バンプコミット忘れ）" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "タグが main に含まれていない（CI を通っていないコミット）" >&2
            exit 1
          fi
      - name: draft Release を作成（既存なら何もしない）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME は作成済み（再実行）"
            exit 0
          fi
          PREV="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          # 変更内容は**注釈付きタグの本文**（1 行目の要約より後ろ）を使う。
          # リリース手順が `git tag -a` を必須にしているので、情報源がタグ 1 つに収まり
          # 「タグの注釈がそのままリリース説明になる」という git の素直な使い方になる。
          # 本文が空なら節ごと省く（v0.7.0〜v0.11.0 は要約 1 行だけだったので後から手で埋めた）
          NOTES="$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME")"
          {
            if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
              echo "## 変更内容"
              echo ""
              printf '%s\n' "$NOTES"
              echo ""
            fi
            echo "## インストール"
            echo ""
            echo "Assets からお使いのプラットフォームのアーカイブをダウンロードして展開し、"
            echo "\`yuzu\` を PATH の通った場所へ置いてください。"
            echo "検証は \`sha256sum -c SHA256SUMS\`（macOS は \`shasum -a 256 -c SHA256SUMS\`）。"
            echo ""
            echo "Rust 1.87 以降ならソースからもインストールできます:"
            echo ""
            echo '```bash'
            echo "cargo install --locked --git https://github.com/$GITHUB_REPOSITORY --tag $GITHUB_REF_NAME yuzu-cli"
            echo '```'
            if [ -n "$PREV" ]; then
              echo ""
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$GITHUB_REF_NAME"
            fi
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "yuzu $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"

  # 第三者ライセンスの通知（THIRD-PARTY-LICENSES）を 1 回だけ作り、各アーカイブへ配る。
  # 配布する 4 ターゲットの依存の和集合を cargo-about で数えるので、どのランナーでも同じ
  # ファイルになる。生成物はコミットしない（Cargo.lock が動くたびに差分を出さないため）。
  # workflow_dispatch でも動かす（アーカイブの中身を Release なしで確かめられる）
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: licenses
      - name: cargo-about を入れる（版は scripts/third-party-licenses.sh の ABOUT_VERSION）
        run: |
          VERSION="$(grep -m1 '^ABOUT_VERSION=' scripts/third-party-licenses.sh | cut -d'"' -f2)"
          if [ "$(cargo about --version 2>/dev/null | awk '{print $2}')" != "$VERSION" ]; then
            cargo install cargo-about --version "$VERSION" --locked --features cli
          fi
      - name: 通知を生成
        run: |
          # cargo-about は --frozen（ネットワークに出ない）で動くので、全ターゲット分の
          # crate を先に取っておく
          cargo fetch --locked
          scripts/third-party-licenses.sh binary THIRD-PARTY-LICENSES
          test -s THIRD-PARTY-LICENSES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-licenses
          path: THIRD-PARTY-LICENSES
          if-no-files-found: error

  build:
    needs: [create-release, licenses]
    # workflow_dispatch では create-release が skip されるため、その場合もビルドは通す
    if: ${{ !cancelled() && needs.licenses.result == 'success' && (needs.create-release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    strategy:
      # 1 プラットフォームの失敗で他を巻き添えにしない（失敗した job だけ再実行できる）
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            # arm64 runner からのクロスコンパイル（依存は純 Rust のみ = onig 排除済みで安全。
            # smoke は Rosetta 2 で実行される）
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            # glibc 2.35 基準。新しい runner でビルドするほど古い distro で動かなくなる。
            # さらに互換性を広げるなら musl 静的リンク化が将来の改善候補
            runner: ubuntu-22.04
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        # Windows でも同一スクリプトを使う（Git Bash）
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SHA ピンでは ref 名からツールチェインを推定できないため toolchain の明示が必須
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: build
        # release ビルド必須（debug はテーマを rust-embed で埋め込まずファイルシステムから読む）
        run: cargo build --release --locked -p yuzu-cli --target ${{ matrix.target }}

      - name: smoke（バイナリのバージョンが Cargo.toml と一致すること）
        run: |
          VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          BIN="target/${{ matrix.target }}/release/yuzu"
          case "${{ matrix.target }}" in *windows*) BIN="$BIN.exe" ;; esac
          test "$("$BIN" --version)" = "yuzu $VERSION"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-licenses
          path: licenses-artifact

      - name: アーカイブ作成
        id: archive
        run: |
          VERSION="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          NAME="yuzu-v$VERSION-${{ matrix.target }}"
          mkdir stage
          cp README.md LICENSE-MIT LICENSE-APACHE stage/
          # バイナリに入っている第三者のソフトウェアのライセンス表記（licenses ジョブが生成）
          cp licenses-artifact/THIRD-PARTY-LICENSES stage/
          test -s stage/THIRD-PARTY-LICENSES
          case "${{ matrix.target }}" in
            *windows*)
              cp "target/${{ matrix.target }}/release/yuzu.exe" stage/
              (cd stage && 7z a "../$NAME.zip" .)
              echo "asset=$NAME.zip" >> "$GITHUB_OUTPUT"
              ;;
            *)
              cp "target/${{ matrix.target }}/release/yuzu" stage/
              tar -czf "$NAME.tar.gz" -C stage .
              echo "asset=$NAME.tar.gz" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Release へ添付
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" "${{ steps.archive.outputs.asset }}" --clobber

  # 全アセットが出揃ってから SHA256SUMS を添付し、draft を公開する
  publish-release:
    needs: [create-release, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: SHA256SUMS を生成して公開
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir "$RUNNER_TEMP/assets"
          cd "$RUNNER_TEMP/assets"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern 'yuzu-*'
          sha256sum yuzu-* > SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" SHA256SUMS --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
