name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # insta: CI ではスナップショット未承認を必ず失敗にする
  INSTA_UPDATE: "no"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # actions はフルコミット SHA でピン留めする（タグの書き換えによる改ざんを防ぐ）。
      # 更新時は SHA とコメントのバージョンを揃えること
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # SHA ピンでは ref 名からツールチェインを推定できないため toolchain の明示が必須
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: build
        run: cargo build --workspace

      # crates.io 公開対象（tankan・mikan）のパッケージ検証。メタデータ・同梱内容の
      # 回帰を PR で検出する。実公開は手動 cargo publish（CLAUDE.md「リリース手順」）
      - name: package (tankan, mikan)
        run: cargo package --locked -p tankan -p mikan

      # wasm32 でのコンパイル可能性を確認する
      # - mikan-wasm: 成果物は scripts/build-search-wasm.sh で vendor 済み
      # - tankan: wasm ターゲットの担保（M5。I/O・時刻・乱数非依存を維持する）
      - name: wasm check
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p mikan-wasm --target wasm32-unknown-unknown
          cargo check -p tankan --target wasm32-unknown-unknown

      # docs/: yuzu 自身のドキュメントサイト（Phase 36）を PR でも検証する。
      # デプロイは docs.yml（main push）だが、壊れた原稿・SSR フォールバックの
      # 混入はマージ前にここで検出する
      - name: docs site (yuzu check && yuzu build)
        run: |
          cd docs
          # 診断は GitHub Actions の注釈で出す（Phase 46）。cd docs しているが、
          # パスは GITHUB_WORKSPACE からの相対へ自動で付け替わるので PR の
          # diff 行に紐づく。注釈の画面表示は 1 ステップ 10 件までで、残りはログに出る
          "$GITHUB_WORKSPACE/target/debug/yuzu" check --format github
          "$GITHUB_WORKSPACE/target/debug/yuzu" build
          test -f dist/index.html
          test -f dist/_search/manifest.json
          # エイリアス（guide/quality の旧 URL）にリダイレクト HTML が生成される
          grep -q 'http-equiv="refresh"' dist/guide/lint/index.html
          # コンテンツインクルード: yuzu.jsonc の引用が展開されている
          grep -q '<figcaption>yuzu.jsonc:15-21</figcaption>' dist/guide/code-and-math/index.html
          # 図表番号: キャプションの採番と参照リンクの自動補完
          grep -q 'id="fig:deps"' dist/development/index.html
          grep -q '<a href="#fig:deps">図 1</a>' dist/development/index.html
          # 折りたたみ Admonition: details/summary で描画される
          grep -q '<details class="markdown-alert markdown-alert-tip">' dist/guide/writing/index.html
          # 折りたたみ内へのアンカージャンプを開く JS が配信される
          grep -q 'js/details-target.js' dist/guide/writing/index.html
          # サイドバーのスクロール位置維持（base.jinja のインライン script）が配信されている
          grep -q 'yuzu-sidebar-scroll' dist/index.html
          # タブ / コードグループ（Phase 50）: radio + label のマークアップが出ている
          grep -q 'class="tab-label"' dist/guide/code-and-math/index.html
          # Markdown 断片（Phase 51）: docs/snippets/ の断片が展開された散文で出ている
          grep -q '取り込まれた Markdown 断片です' dist/guide/writing/index.html
          # 診断ルールのリファレンス（Phase 46）が配信されている
          grep -q 'broken-anchor' dist/reference/rules/index.html
          # 出力先・URL の安全化（v0.10.1）で足したルールが原稿に載っている
          grep -q 'route-conflict' dist/reference/rules/index.html
          grep -q 'unsafe-page-path' dist/reference/rules/index.html
          # 検索の追加読み込み（Phase 49）の JS が埋め込み経由で配信されている
          # （機能自体はブラウザ操作なので CI では検証できない。配線ゲート）
          grep -q 'search-more' dist/_assets/js/search-ui.js
          # mermaid backend: ssr のサイトなので、フォールバック（= mermaid.js の
          # script タグ）が出たら tankan の回帰として失敗させる
          # （本文中の文字列と区別するため src 属性の形で照合する）
          if grep -rlE 'src="[^"]*vendor/mermaid\.min\.js"' dist/ --include="*.html"; then
            echo "docs で SSR フォールバックが発生している（上記ページ）" >&2
            exit 1
          fi

      # e2e: サンプルプロジェクト生成 → ビルド → ネイティブ検索（誤字クエリ込み）
      - name: e2e (yuzu new && yuzu build && yuzu search)
        run: |
          ./target/debug/yuzu new "$RUNNER_TEMP/e2e-docs"
          cd "$RUNNER_TEMP/e2e-docs"
          test -f .github/workflows/deploy.yml
          "$GITHUB_WORKSPACE/target/debug/yuzu" build
          test -f dist/index.html
          test -f dist/guide/getting-started/index.html
          test -f dist/_search/manifest.json
          test -f dist/_search/search_bg.wasm
          # --base-url は設定より優先して配信パスを差し替える（deploy.yml が使う契約）
          "$GITHUB_WORKSPACE/target/debug/yuzu" build --base-url /docs/
          grep -q '/docs/_assets/' dist/index.html
          "$GITHUB_WORKSPACE/target/debug/yuzu" search "はじめに" | grep "はじめに"
          # タイポトレランスの実ヒット確認（Phase 21: 出力の有無だけでは日本語 typo の
          # 不具合を見逃した反省から、ヒット内容まで検証する）
          "$GITHUB_WORKSPACE/target/debug/yuzu" search "ダーくモード" | grep -q "ダークモード"
          # フレーズ検索（Phase 31）: 隣接一致でヒットし、逆順は 0 件
          "$GITHUB_WORKSPACE/target/debug/yuzu" search '"ライブリロード"' | grep -q "ライブリロード"
          "$GITHUB_WORKSPACE/target/debug/yuzu" search '"リロードライブ"' | grep -q "一致するページはありませんでした"
          # Phase 6: fmt/lint/check（正常系 = 0、違反注入で = 1 の終了コード契約）
          "$GITHUB_WORKSPACE/target/debug/yuzu" fmt --check
          "$GITHUB_WORKSPACE/target/debug/yuzu" lint
          "$GITHUB_WORKSPACE/target/debug/yuzu" check
          # Phase 49: scaffold に v0.8〜v0.9 機能の「動く実例」が入っている
          # （エイリアスのリダイレクト HTML と、file= で引用したソースのキャプション）
          test -f dist/guide/intro/index.html
          grep -q '<figcaption>snippets/greet.rs</figcaption>' dist/index.html
          # Phase 51: scaffold の Markdown 断片が展開されている（フェンス原文ではなく散文で照合）
          grep -q '参照している全ページに反映されます' dist/index.html
          # Phase 22: openapi/jsonschema SSR — scaffold の jsonschema ブロックが
          # 静的 HTML 化されていること＋ file: 参照は仕様ファイルの変更だけで反映されること
          # （jsonschema は class="api-spec api-schema" なので閉じ引用符まで書かない）
          grep -q 'class="api-spec' dist/guide/getting-started/index.html
          mkdir -p specs
          printf 'openapi: 3.0.3\ninfo:\n  title: E2E API v1\n  version: 1.0.0\npaths: {}\n' > specs/api.yaml
          printf -- '---\ntitle: API\n---\n\n# API\n\n```openapi\nfile: specs/api.yaml\n```\n' > content/api.md
          "$GITHUB_WORKSPACE/target/debug/yuzu" build
          grep -q 'E2E API v1' dist/api/index.html
          printf 'openapi: 3.0.3\ninfo:\n  title: E2E API v2\n  version: 1.0.0\npaths: {}\n' > specs/api.yaml
          "$GITHUB_WORKSPACE/target/debug/yuzu" build
          grep -q 'E2E API v2' dist/api/index.html
          # content 同伴アセット: ページ横の画像が dist へコピーされ src が解決される
          printf 'PNG-E2E' > content/guide/pic.png
          printf -- '\n![図](pic.png)\n' >> content/guide/getting-started.md
          "$GITHUB_WORKSPACE/target/debug/yuzu" build
          test -f dist/guide/pic.png
          grep -q 'src="/guide/pic.png"' dist/guide/getting-started/index.html
          "$GITHUB_WORKSPACE/target/debug/yuzu" check
          # Phase 47: API 仕様の file: 参照を check が検証する（描画はエラーボックスで
          # 継続するため、公開前に気づける場所はここだけ）
          mv specs/api.yaml specs/api.yaml.bak
          if "$GITHUB_WORKSPACE/target/debug/yuzu" check; then
            echo "check が仕様ファイルの不在を検出しなかった" >&2
            exit 1
          fi
          "$GITHUB_WORKSPACE/target/debug/yuzu" check --format json 2>/dev/null \
            | grep -q '"rule": "spec-error"'
          mv specs/api.yaml.bak specs/api.yaml
          "$GITHUB_WORKSPACE/target/debug/yuzu" check
          # Phase 47: yuzu.jsonc のキーのタイポを検出する（従来は無言で無視されていた）
          cp yuzu.jsonc yuzu.jsonc.bak
          printf '{\n  "markdwon": { "gfm": true }\n}\n' > yuzu.jsonc
          "$GITHUB_WORKSPACE/target/debug/yuzu" check --format json 2>/dev/null \
            | grep -q '"rule": "config-unknown-key"'
          # 設定の診断はプロジェクトルート相対で出る（content 相対だと .. が混ざり、
          # GitHub の注釈がリポジトリのファイルへ紐づかなくなる）
          "$GITHUB_WORKSPACE/target/debug/yuzu" check --format json 2>/dev/null \
            | grep -q '"path": "yuzu.jsonc"'
          mv yuzu.jsonc.bak yuzu.jsonc
          "$GITHUB_WORKSPACE/target/debug/yuzu" check
          # Phase 48: コンテンツインクルードの参照先だけを編集しても検索索引が追随する
          # （検索 tf のキャッシュがページ source ハッシュだけで判定していた回帰ガード。
          # --force を付けずにインクリメンタルで検証することが要点）
          cp yuzu.jsonc yuzu.jsonc.bak
          printf '{\n  "search": { "indexCode": true }\n}\n' > yuzu.jsonc
          mkdir -p snippets
          printf 'fn alphaSymbol() {}\n' > snippets/demo.rs
          printf -- '---\ntitle: 引用\n---\n\n# 引用\n\n```rust file="snippets/demo.rs"\n```\n' > content/inc.md
          "$GITHUB_WORKSPACE/target/debug/yuzu" build
          "$GITHUB_WORKSPACE/target/debug/yuzu" search alphaSymbol | grep -q "引用"
          printf 'fn betaSymbol() {}\n' > snippets/demo.rs
          "$GITHUB_WORKSPACE/target/debug/yuzu" build
          "$GITHUB_WORKSPACE/target/debug/yuzu" search betaSymbol | grep -q "引用"
          "$GITHUB_WORKSPACE/target/debug/yuzu" search alphaSymbol \
            | grep -q "一致するページはありませんでした"
          rm content/inc.md
          mv yuzu.jsonc.bak yuzu.jsonc
          # Phase 49: fmt --diff は unified diff を出し、--check を含意する
          # （書き換えない・差分ありで終了コード 1）。出力がそのまま当てられる
          # パッチであることが実質の契約なので patch -p1 まで通す
          printf -- '---\ntitle: 未整形\n---\n\n#   見出し\n\n*  項目\n' > content/unformatted.md
          before=$(sha256sum content/unformatted.md)
          if "$GITHUB_WORKSPACE/target/debug/yuzu" fmt --diff > "$RUNNER_TEMP/fmt.diff"; then
            echo "fmt --diff が整形差分を検出しなかった" >&2
            exit 1
          fi
          test "$before" = "$(sha256sum content/unformatted.md)"
          grep -q '^--- a/content/unformatted.md$' "$RUNNER_TEMP/fmt.diff"
          grep -q '^+++ b/content/unformatted.md$' "$RUNNER_TEMP/fmt.diff"
          grep -q '^@@ ' "$RUNNER_TEMP/fmt.diff"
          patch -p1 < "$RUNNER_TEMP/fmt.diff"
          "$GITHUB_WORKSPACE/target/debug/yuzu" fmt --check
          rm content/unformatted.md
          # Phase 49: 下流が先に閉じても panic しない（SIGPIPE）。
          # **パイプバッファ（64KB）を超える出力でないと EPIPE 自体が起きない**ので、
          # 先に大きいページを作る（この前置きが無いとゲートが空振りする）
          printf -- '---\ntitle: 大きなページ\n---\n\n# 大きなページ\n\n' > content/big.md
          for i in $(seq 1 5000); do printf 'SIGPIPE 検証用の段落 %s です。\n\n' "$i"; done >> content/big.md
          "$GITHUB_WORKSPACE/target/debug/yuzu" llms --full 2> "$RUNNER_TEMP/sigpipe.err" | head -c 1 > /dev/null
          test "${PIPESTATUS[0]}" -eq 0
          # `! grep` は set -e の対象外（POSIX の否定パイプライン）なので if で明示する
          if grep -qiE 'broken pipe|panicked' "$RUNNER_TEMP/sigpipe.err"; then
            echo "llms --full | head で panic した" >&2
            exit 1
          fi
          "$GITHUB_WORKSPACE/target/debug/yuzu" build
          "$GITHUB_WORKSPACE/target/debug/yuzu" search 段落 --limit 5000 2> "$RUNNER_TEMP/sigpipe2.err" | head -c 1 > /dev/null
          test "${PIPESTATUS[0]}" -eq 0
          if grep -qiE 'broken pipe|panicked' "$RUNNER_TEMP/sigpipe2.err"; then
            echo "search | head で panic した" >&2
            exit 1
          fi
          rm content/big.md
          "$GITHUB_WORKSPACE/target/debug/yuzu" build
          echo '[壊れリンク](missing.md)' >> content/index.md
          if "$GITHUB_WORKSPACE/target/debug/yuzu" check; then
            echo "check が壊れリンクを検出しなかった" >&2
            exit 1
          fi
          # Phase 46: 機械可読出力（壊れリンクが残っている = 診断が出る状態で検証する）
          # json は単一オブジェクトで、標準出力に他の行を一切混ぜない
          "$GITHUB_WORKSPACE/target/debug/yuzu" check --format json > "$RUNNER_TEMP/diag.json" || true
          head -1 "$RUNNER_TEMP/diag.json" | grep -q '^{$'
          grep -q '"rule": "broken-link"' "$RUNNER_TEMP/diag.json"
          grep -q '"summary"' "$RUNNER_TEMP/diag.json"
          # github は注釈行を出す（GITHUB_WORKSPACE 外なのでプロジェクトルート相対）
          "$GITHUB_WORKSPACE/target/debug/yuzu" check --format github \
            | grep -q '^::error file=content/index.md,line='
          # GITHUB_WORKSPACE 配下なら、その相対へ付け替わる（docs で cd している対策の本体）
          GITHUB_WORKSPACE="$RUNNER_TEMP" "$GITHUB_WORKSPACE/target/debug/yuzu" check --format github \
            | grep -q '^::error file=e2e-docs/content/index.md,'
          # lint --fix と json を併用しても標準出力が JSON のまま（進捗は stderr へ）
          "$GITHUB_WORKSPACE/target/debug/yuzu" lint --fix --format json 2>/dev/null \
            | head -1 | grep -q '^{$'
          # tracing のログが標準出力へ漏れないこと（既定 writer は stdout なので明示指定が要る）。
          # 重複キーは警告を出す数少ない経路で、混ざると JSON のパースが壊れる
          # （設定キーはすべて省略可能なので、この最小 jsonc でも check は動く）
          printf '{\n  "site": { "title": "A", "title": "B" }\n}\n' > yuzu.jsonc
          "$GITHUB_WORKSPACE/target/debug/yuzu" check --format json 2>/dev/null \
            | head -1 | grep -q '^{$'
