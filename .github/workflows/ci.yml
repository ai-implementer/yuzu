name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # insta: CI ではスナップショット未承認を必ず失敗にする
  INSTA_UPDATE: "no"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # actions はフルコミット SHA でピン留めする（タグの書き換えによる改ざんを防ぐ）。
      # 更新時は SHA とコメントのバージョンを揃えること
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # SHA ピンでは ref 名からツールチェインを推定できないため toolchain の明示が必須
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: fmt
        run: cargo fmt --all --check

      # 未使用依存の検出（ソース走査ベースで高速・コンパイル不要）。
      # false positive はその crate の Cargo.toml の
      # [package.metadata.cargo-machete] ignored = ["<crate>"] で個別に抑制する
      - name: machete (unused dependencies)
        uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: build
        run: cargo build --workspace

      # crates.io 公開対象（tankan・mikan・kabosu）のパッケージ検証。メタデータ・
      # 同梱内容の回帰を PR で検出する。実公開は手動 cargo publish（CLAUDE.md「リリース手順」）
      - name: package (tankan, mikan, kabosu)
        run: cargo package --locked -p tankan -p mikan -p kabosu

      # kabosu の依存ゼロ検査: package 後の正規化 manifest に通常依存・build 依存・
      # ターゲット固有依存のセクションが無いことを縛る（dev 依存だけは許可）
      - name: kabosu dependency-free check
        run: |
          version=$(grep '^version = ' crates/kabosu/Cargo.toml | head -1 | cut -d'"' -f2)
          manifest="target/package/kabosu-$version/Cargo.toml"
          test -f "$manifest" || { echo "package 済み manifest が見つからない: $manifest" >&2; exit 1; }
          if grep -qE '^\[(dependencies|build-dependencies)\]|^\[target\.' "$manifest"; then
            echo "kabosu に通常依存が入っている（依存ゼロを維持する）:" >&2
            grep -E '^\[(dependencies|build-dependencies)\]|^\[target\.' "$manifest" >&2
            exit 1
          fi

      # wasm32 でのコンパイル可能性を確認する
      # - mikan-wasm: 成果物は scripts/build-search-wasm.sh で vendor 済み
      # - tankan: wasm ターゲットの担保（M5。I/O・時刻・乱数非依存を維持する）
      - name: wasm check
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p mikan-wasm --target wasm32-unknown-unknown
          cargo check -p tankan --target wasm32-unknown-unknown
          cargo check -p kabosu --target wasm32-unknown-unknown

      # kabosu の no_std 担保。std が存在しないターゲットでの check なので、
      # std 依存の紛れ込みが必ずコンパイルエラーになる
      # （wasm32-unknown-unknown は std があるため no_std の担保にはならない）
      - name: no_std check (kabosu)
        run: |
          rustup target add thumbv7em-none-eabi
          cargo check -p kabosu --target thumbv7em-none-eabi

      # docs/: yuzu 自身のドキュメントサイト（Phase 36）を PR でも検証する。
      # デプロイは docs.yml（main push）だが、壊れた原稿・SSR フォールバックの
      # 混入はマージ前にここで検出する
      - name: docs site (yuzu check && yuzu build)
        run: |
          cd docs
          # 診断は GitHub Actions の注釈で出す（Phase 46）。cd docs しているが、
          # パスは GITHUB_WORKSPACE からの相対へ自動で付け替わるので PR の
          # diff 行に紐づく。注釈の画面表示は 1 ステップ 10 件までで、残りはログに出る
          "$GITHUB_WORKSPACE/target/debug/yuzu" check --format github
          "$GITHUB_WORKSPACE/target/debug/yuzu" build
          test -f dist/index.html
          test -f dist/_search/manifest.json
          # エイリアス（guide/quality の旧 URL）にリダイレクト HTML が生成される
          grep -q 'http-equiv="refresh"' dist/guide/lint/index.html
          # コンテンツインクルード: yuzu.toml の引用が展開されている
          grep -q '<figcaption>yuzu.toml:25-45</figcaption>' dist/guide/code-and-math/index.html
          # 図表番号: キャプションの採番と参照リンクの自動補完
          grep -q 'id="fig:deps"' dist/development/index.html
          grep -q '<a href="#fig:deps">図 1</a>' dist/development/index.html
          # 折りたたみ Admonition: details/summary で描画される
          grep -q '<details class="markdown-alert markdown-alert-tip">' dist/guide/writing/index.html
          # 折りたたみ内へのアンカージャンプを開く JS が配信される
          grep -q 'js/details-target.js' dist/guide/writing/index.html
          # サイドバーのスクロール位置維持（base.jinja のインライン script）が配信されている
          grep -q 'yuzu-sidebar-scroll' dist/index.html
          # タブ / コードグループ（Phase 50）: radio + label のマークアップが出ている
          grep -q 'class="tab-label"' dist/guide/code-and-math/index.html
          # Markdown 断片（Phase 51）: docs/snippets/ の断片が展開された散文で出ている
          grep -q '取り込まれた Markdown 断片です' dist/guide/writing/index.html
          # 用語集（Phase 52）: 本文の略語が辞書の説明つきで <abbr> 化されている
          grep -q '<abbr title="Server-Side Rendering' dist/guide/writing/index.html
          # 用語集ページが自動生成され、用語ごとのアンカーが振られている
          grep -q 'id="ssr"' dist/glossary/index.html
          # 合成ページが nav 経路に乗っている（サイドバーに出る）
          grep -q 'href="/glossary/"' dist/index.html
          # 用語集ページ自身は abbr 化しない（説明文の中で用語が光る循環を防ぐ）
          ! grep -q '<abbr' dist/glossary/index.html
          # 約物に隣接した強調（Phase 53 の cjk_friendly_emphasis）
          grep -q '<strong>「重要」</strong>' dist/guide/writing/index.html
          grep -q '<strong>この文は重要です。</strong>但し' dist/guide/writing/index.html
          # 定義リスト（Phase 53 の description_lists）
          grep -q '<dl>' dist/guide/writing/index.html
          # 検索の絞り込み: インデックスにナビ由来の区分が焼き込まれている
          grep -q '"groups"' dist/_search/manifest.json
          grep -q '"docGroups"' dist/_search/manifest.json
          # エンジン側で絞り込めて件数も絞り込み後になる（ブラウザ操作は CI で
          # 検証できないので、同一エンジンを通る CLI で担保する）
          "$GITHUB_WORKSPACE/target/debug/yuzu" search --section 開発 "キャッシュ" | grep -q '/development/'
          # 絞り込み UI の配線ゲート（機能自体はブラウザ操作なので CI では検証できない。
          # Phase 54 でチップは結果ページ search-page.js へ移動した）
          grep -q 'search-filter-chip' dist/_assets/js/search-page.js
          grep -q 'composedPath' dist/_assets/js/search-ui.js
          # 診断ルールのリファレンス（Phase 46）が配信されている
          grep -q 'broken-anchor' dist/reference/rules/index.html
          # 出力先・URL の安全化（v0.10.1）で足したルールが原稿に載っている
          grep -q 'route-conflict' dist/reference/rules/index.html
          grep -q 'unsafe-page-path' dist/reference/rules/index.html
          # URL のパーセントエンコード（Phase 64）が原稿に載っている
          grep -q 'パーセントエンコード' dist/guide/writing/index.html
          grep -q '%E8%A8%AD%E8%A8%88/%E6%A6%82%20%E8%A6%81' dist/guide/writing/index.html
          # 配信とテーマ契約（Phase 65）: テーマ上書きの追随責任と配信のリンク遮断が
          # 原稿に載り、docs（ハイライト有効）では syntect.css が <link> される
          grep -q '追随する' dist/guide/deploy/index.html
          grep -q 'シンボリックリンクを辿りません' dist/reference/cli/index.html
          grep -q 'css/syntect.css' dist/index.html && test -f dist/_assets/css/syntect.css
          # 外部リンク検査（Phase 66）が原稿に載っている
          grep -q 'external-link-broken' dist/reference/rules/index.html
          grep -q -- '--external-links' dist/reference/cli/index.html
          grep -q 'ネットワーク I/O' dist/development/index.html
          # ページ単位の lint 抑制（Phase 58）が原稿に載っている
          grep -q 'unused-lint-suppression' dist/reference/rules/index.html
          grep -q 'lintDisable' dist/guide/quality/index.html
          # 行単位の lint 抑制（Phase 59）が原稿に載っている
          grep -q 'yuzu-lint-disable-next-line' dist/reference/rules/index.html
          grep -q 'yuzu-lint-disable-next-line' dist/guide/quality/index.html
          # 全ルールの enable/disable（Phase 60）が原稿に載っている
          grep -q 'プロジェクト全体の無効化' dist/reference/rules/index.html
          grep -q 'プロジェクト全体の無効化' dist/guide/quality/index.html
          # 検索の追加読み込み（Phase 49 → Phase 54 で結果ページへ移動）の JS が
          # 埋め込み経由で配信されている（機能自体はブラウザ操作なので CI では
          # 検証できない。配線ゲート）
          grep -q 'search-page-more' dist/_assets/js/search-page.js
          # 検索結果ページ（Phase 54）: 専用ページが生成され、集約からは除外される
          test -f dist/search/index.html
          grep -q 'id="yuzu-search-page"' dist/search/index.html
          grep -q 'data-page-size' dist/search/index.html
          # ドロップダウン → 結果ページへの導線（全ページに data-search-page が配られる）
          grep -q 'data-search-page' dist/index.html
          # llms.txt に検索結果ページが載らない（guide/search.md は実ページなので残る）
          ! grep -q '\[検索\](' dist/llms.txt
          # ページ単位 .md も出さない
          ! test -f dist/search.md
          # ナビと目次の規模対応（Phase 56）: 現在セクションだけ開いた折りたたみ・
          # 他セクションは閉じる・TOC の nav 化・scrollspy 基準線の実測化
          grep -q '<details class="nav-section" open>' dist/guide/writing/index.html
          grep -q '<details class="nav-section">' dist/guide/writing/index.html
          grep -q '<nav aria-label="このページの目次">' dist/guide/writing/index.html
          grep -q 'scrollMarginTop' dist/_assets/js/scrollspy.js
          # 印刷 / PDF 対応（Phase 55）: print CSS・ダーク定義の画面専用化・
          # 印刷前に閉じた details を開く JS が配信されている
          grep -q '@media print' dist/_assets/css/theme.css
          grep -q '@media screen' dist/_assets/css/syntect.css
          grep -q 'beforeprint' dist/_assets/js/details-target.js
          # SSR 図のモバイル対応（Phase 61）: 縮小せず figure 内で横スクロール
          grep -A 3 'figure.mermaid-ssr {' dist/_assets/css/theme.css | grep -q 'overflow-x: auto'
          # ビルドの進捗ログ（RUST_LOG の文書化）が CLI リファレンスに載っている
          grep -q 'RUST_LOG' dist/reference/cli/index.html
          # mermaid backend: ssr のサイトなので、フォールバック（= mermaid.js の
          # script タグ）が出たら tankan の回帰として失敗させる
          # （本文中の文字列と区別するため src 属性の形で照合する）
          if grep -rlE 'src="[^"]*vendor/mermaid\.min\.js"' dist/ --include="*.html"; then
            echo "docs で SSR フォールバックが発生している（上記ページ）" >&2
            exit 1
          fi

      # e2e: サンプルプロジェクト生成 → ビルド → ネイティブ検索（誤字クエリ込み）
      - name: e2e (yuzu new && yuzu build && yuzu search)
        run: |
          ./target/debug/yuzu new "$RUNNER_TEMP/e2e-docs"
          cd "$RUNNER_TEMP/e2e-docs"
          test -f .github/workflows/deploy.yml
          "$GITHUB_WORKSPACE/target/debug/yuzu" build
          test -f dist/index.html
          test -f dist/guide/getting-started/index.html
          test -f dist/_search/manifest.json
          test -f dist/_search/search_bg.wasm
          # scaffold は検索結果ページ（search.page）を有効にして配る（Phase 54）
          test -f dist/search/index.html
          # --base-url は設定より優先して配信パスを差し替える（deploy.yml が使う契約）
          "$GITHUB_WORKSPACE/target/debug/yuzu" build --base-url /docs/
          grep -q '/docs/_assets/' dist/index.html
          "$GITHUB_WORKSPACE/target/debug/yuzu" search "はじめに" | grep "はじめに"
          # タイポトレランスの実ヒット確認（Phase 21: 出力の有無だけでは日本語 typo の
          # 不具合を見逃した反省から、ヒット内容まで検証する）
          "$GITHUB_WORKSPACE/target/debug/yuzu" search "ダーくモード" | grep -q "ダークモード"
          # フレーズ検索（Phase 31）: 隣接一致でヒットし、逆順は 0 件
          "$GITHUB_WORKSPACE/target/debug/yuzu" search '"ライブリロード"' | grep -q "ライブリロード"
          "$GITHUB_WORKSPACE/target/debug/yuzu" search '"リロードライブ"' | grep -q "一致するページはありませんでした"
          # Phase 6: fmt/lint/check（正常系 = 0、違反注入で = 1 の終了コード契約）
          "$GITHUB_WORKSPACE/target/debug/yuzu" fmt --check
          "$GITHUB_WORKSPACE/target/debug/yuzu" lint
          "$GITHUB_WORKSPACE/target/debug/yuzu" check
          # Phase 49: scaffold に v0.8〜v0.9 機能の「動く実例」が入っている
          # （エイリアスのリダイレクト HTML と、file= で引用したソースのキャプション）
          test -f dist/guide/intro/index.html
          grep -q '<figcaption>snippets/greet.rs</figcaption>' dist/index.html
          # Phase 51: scaffold の Markdown 断片が展開されている（フェンス原文ではなく散文で照合）
          grep -q '参照している全ページに反映されます' dist/index.html
          # Phase 52: scaffold の略語が <abbr> 化され、用語集ページが生成される
          grep -q '<abbr title="Static Site Generator' dist/index.html
          test -f dist/glossary/index.html
          # Phase 53: 定義リストが描画される
          grep -q '<dl>' dist/index.html
          # Phase 53: 未知のセクション名は実行エラー（終了コード 2）
          ! "$GITHUB_WORKSPACE/target/debug/yuzu" search --section 存在しない "はじめに"
          # Phase 22: openapi/jsonschema SSR — scaffold の jsonschema ブロックが
          # 静的 HTML 化されていること＋ file: 参照は仕様ファイルの変更だけで反映されること
          # （jsonschema は class="api-spec api-schema" なので閉じ引用符まで書かない）
          grep -q 'class="api-spec' dist/guide/getting-started/index.html
          mkdir -p specs
          printf 'openapi: 3.0.3\ninfo:\n  title: E2E API v1\n  version: 1.0.0\npaths: {}\n' > specs/api.yaml
          printf -- '---\ntitle: API\n---\n\n# API\n\n```openapi\nfile: specs/api.yaml\n```\n' > content/api.md
          "$GITHUB_WORKSPACE/target/debug/yuzu" build
          grep -q 'E2E API v1' dist/api/index.html
          printf 'openapi: 3.0.3\ninfo:\n  title: E2E API v2\n  version: 1.0.0\npaths: {}\n' > specs/api.yaml
          "$GITHUB_WORKSPACE/target/debug/yuzu" build
          grep -q 'E2E API v2' dist/api/index.html
          # content 同伴アセット: ページ横の画像が dist へコピーされ src が解決される
          printf 'PNG-E2E' > content/guide/pic.png
          printf -- '\n![図](pic.png)\n' >> content/guide/getting-started.md
          "$GITHUB_WORKSPACE/target/debug/yuzu" build
          test -f dist/guide/pic.png
          grep -q 'src="/guide/pic.png"' dist/guide/getting-started/index.html
          "$GITHUB_WORKSPACE/target/debug/yuzu" check
          # Phase 47: API 仕様の file: 参照を check が検証する（描画はエラーボックスで
          # 継続するため、公開前に気づける場所はここだけ）
          mv specs/api.yaml specs/api.yaml.bak
          if "$GITHUB_WORKSPACE/target/debug/yuzu" check; then
            echo "check が仕様ファイルの不在を検出しなかった" >&2
            exit 1
          fi
          "$GITHUB_WORKSPACE/target/debug/yuzu" check --format json 2>/dev/null \
            | grep -q '"rule": "spec-error"'
          mv specs/api.yaml.bak specs/api.yaml
          "$GITHUB_WORKSPACE/target/debug/yuzu" check
          # yuzu.toml のキーのタイポは設定エラーで止まる（exit 2。v0.14 で JSONC の
          # config-unknown-key 警告から変更。位置と対応キー一覧を stderr に出し、
          # --format json でも標準出力には何も書かない）
          cp yuzu.toml yuzu.toml.bak
          printf '[markdwon]\ngfm = true\n' > yuzu.toml
          if "$GITHUB_WORKSPACE/target/debug/yuzu" check --format json \
               > "$RUNNER_TEMP/typo.out" 2> "$RUNNER_TEMP/typo.err"; then
            echo "check が yuzu.toml の未知キーを検出しなかった" >&2
            exit 1
          fi
          grep -q 'yuzu.toml:1:2: 未知のキー `markdwon`' "$RUNNER_TEMP/typo.err"
          grep -q 'markdown' "$RUNNER_TEMP/typo.err"   # 正しい綴りが対応キー一覧に出る
          test ! -s "$RUNNER_TEMP/typo.out"
          # 旧形式（camelCase）のキーも同じく設定エラー（互換読み込みは作らない）
          printf '[site]\nbaseUrl = "/docs/"\n' > yuzu.toml
          if "$GITHUB_WORKSPACE/target/debug/yuzu" build 2> "$RUNNER_TEMP/camel.err"; then
            echo "build が旧形式のキーを受理した" >&2
            exit 1
          fi
          grep -q 'base_url' "$RUNNER_TEMP/camel.err"
          mv yuzu.toml.bak yuzu.toml
          "$GITHUB_WORKSPACE/target/debug/yuzu" check
          # Phase 48: コンテンツインクルードの参照先だけを編集しても検索索引が追随する
          # （検索 tf のキャッシュがページ source ハッシュだけで判定していた回帰ガード。
          # --force を付けずにインクリメンタルで検証することが要点）
          cp yuzu.toml yuzu.toml.bak
          printf '[search]\nindex_code = true\n' > yuzu.toml
          mkdir -p snippets
          printf 'fn alphaSymbol() {}\n' > snippets/demo.rs
          printf -- '---\ntitle: 引用\n---\n\n# 引用\n\n```rust file="snippets/demo.rs"\n```\n' > content/inc.md
          "$GITHUB_WORKSPACE/target/debug/yuzu" build
          "$GITHUB_WORKSPACE/target/debug/yuzu" search alphaSymbol | grep -q "引用"
          printf 'fn betaSymbol() {}\n' > snippets/demo.rs
          "$GITHUB_WORKSPACE/target/debug/yuzu" build
          "$GITHUB_WORKSPACE/target/debug/yuzu" search betaSymbol | grep -q "引用"
          "$GITHUB_WORKSPACE/target/debug/yuzu" search alphaSymbol \
            | grep -q "一致するページはありませんでした"
          rm content/inc.md
          mv yuzu.toml.bak yuzu.toml
          # Phase 49: fmt --diff は unified diff を出し、--check を含意する
          # （書き換えない・差分ありで終了コード 1）。出力がそのまま当てられる
          # パッチであることが実質の契約なので patch -p1 まで通す
          printf -- '---\ntitle: 未整形\n---\n\n#   見出し\n\n*  項目\n' > content/unformatted.md
          before=$(sha256sum content/unformatted.md)
          if "$GITHUB_WORKSPACE/target/debug/yuzu" fmt --diff > "$RUNNER_TEMP/fmt.diff"; then
            echo "fmt --diff が整形差分を検出しなかった" >&2
            exit 1
          fi
          test "$before" = "$(sha256sum content/unformatted.md)"
          grep -q '^--- a/content/unformatted.md$' "$RUNNER_TEMP/fmt.diff"
          grep -q '^+++ b/content/unformatted.md$' "$RUNNER_TEMP/fmt.diff"
          grep -q '^@@ ' "$RUNNER_TEMP/fmt.diff"
          patch -p1 < "$RUNNER_TEMP/fmt.diff"
          "$GITHUB_WORKSPACE/target/debug/yuzu" fmt --check
          rm content/unformatted.md
          # Phase 49: 下流が先に閉じても panic しない（SIGPIPE）。
          # **パイプバッファ（64KB）を超える出力でないと EPIPE 自体が起きない**ので、
          # 先に大きいページを作る（この前置きが無いとゲートが空振りする）
          printf -- '---\ntitle: 大きなページ\n---\n\n# 大きなページ\n\n' > content/big.md
          for i in $(seq 1 5000); do printf 'SIGPIPE 検証用の段落 %s です。\n\n' "$i"; done >> content/big.md
          "$GITHUB_WORKSPACE/target/debug/yuzu" llms --full 2> "$RUNNER_TEMP/sigpipe.err" | head -c 1 > /dev/null
          test "${PIPESTATUS[0]}" -eq 0
          # `! grep` は set -e の対象外（POSIX の否定パイプライン）なので if で明示する
          if grep -qiE 'broken pipe|panicked' "$RUNNER_TEMP/sigpipe.err"; then
            echo "llms --full | head で panic した" >&2
            exit 1
          fi
          "$GITHUB_WORKSPACE/target/debug/yuzu" build
          "$GITHUB_WORKSPACE/target/debug/yuzu" search 段落 --limit 5000 2> "$RUNNER_TEMP/sigpipe2.err" | head -c 1 > /dev/null
          test "${PIPESTATUS[0]}" -eq 0
          if grep -qiE 'broken pipe|panicked' "$RUNNER_TEMP/sigpipe2.err"; then
            echo "search | head で panic した" >&2
            exit 1
          fi
          rm content/big.md
          "$GITHUB_WORKSPACE/target/debug/yuzu" build
          echo '[壊れリンク](missing.md)' >> content/index.md
          if "$GITHUB_WORKSPACE/target/debug/yuzu" check; then
            echo "check が壊れリンクを検出しなかった" >&2
            exit 1
          fi
          # Phase 46: 機械可読出力（壊れリンクが残っている = 診断が出る状態で検証する）
          # json は単一オブジェクトで、標準出力に他の行を一切混ぜない
          "$GITHUB_WORKSPACE/target/debug/yuzu" check --format json > "$RUNNER_TEMP/diag.json" || true
          head -1 "$RUNNER_TEMP/diag.json" | grep -q '^{$'
          grep -q '"rule": "broken-link"' "$RUNNER_TEMP/diag.json"
          grep -q '"summary"' "$RUNNER_TEMP/diag.json"
          # github は注釈行を出す（GITHUB_WORKSPACE 外なのでプロジェクトルート相対）
          "$GITHUB_WORKSPACE/target/debug/yuzu" check --format github \
            | grep -q '^::error file=content/index.md,line='
          # GITHUB_WORKSPACE 配下なら、その相対へ付け替わる（docs で cd している対策の本体）
          GITHUB_WORKSPACE="$RUNNER_TEMP" "$GITHUB_WORKSPACE/target/debug/yuzu" check --format github \
            | grep -q '^::error file=e2e-docs/content/index.md,'
          # lint --fix と json を併用しても標準出力が JSON のまま（進捗は stderr へ）
          "$GITHUB_WORKSPACE/target/debug/yuzu" lint --fix --format json 2>/dev/null \
            | head -1 | grep -q '^{$'
          # Phase 66: 外部リンク検査（opt-in）。ネットワークへは出ず、自分の preview を
          # 相手にして「4xx → warning・到達不能 → skipped・既定の check は触れない」を検証する
          "$GITHUB_WORKSPACE/target/debug/yuzu" preview --port 48123 >/dev/null 2>&1 &
          PREVIEW_PID=$!
          for _ in $(seq 1 50); do curl -sf -o /dev/null http://127.0.0.1:48123/ && break; sleep 0.2; done
          # down2 は抑制コメント付きの到達不能 URL = 判定できない出現箇所への抑制は unused にしない
          printf '\n[ok](http://127.0.0.1:48123/)\n\n[missing](http://127.0.0.1:48123/no-such-file)\n\n[down](http://127.0.0.1:1/)\n\n<!-- yuzu-lint-disable-next-line external-link-broken -->\n[down2](http://127.0.0.1:1/x)\n' >> content/index.md
          "$GITHUB_WORKSPACE/target/debug/yuzu" check --external-links --format json > "$RUNNER_TEMP/extlink.json" || true
          kill "$PREVIEW_PID"
          grep -q '"rule": "external-link-broken"' "$RUNNER_TEMP/extlink.json"
          grep -q 'no-such-file' "$RUNNER_TEMP/extlink.json"
          grep -q '"skipped": 2' "$RUNNER_TEMP/extlink.json"
          ! grep -q 'unused-lint-suppression' "$RUNNER_TEMP/extlink.json"
          # 既定の check は外部リンクに触れない（診断なし・skipped 0）
          "$GITHUB_WORKSPACE/target/debug/yuzu" check --format json > "$RUNNER_TEMP/diag2.json" || true
          ! grep -q 'external-link-broken' "$RUNNER_TEMP/diag2.json"
          grep -q '"skipped": 0' "$RUNNER_TEMP/diag2.json"
          # tracing のログが標準出力へ漏れないこと（既定 writer は stdout なので明示指定が要る）。
          # input.dir がルート外の警告（config-path-outside-root）は読み込み後も続行して
          # 警告を出す数少ない経路で、混ざると JSON のパースが壊れる
          mkdir -p "$RUNNER_TEMP/shared-docs"
          printf -- '---\ntitle: 共有原稿\n---\n\n# 共有原稿\n' > "$RUNNER_TEMP/shared-docs/index.md"
          printf '[input]\ndir = "../shared-docs"\n' > yuzu.toml
          "$GITHUB_WORKSPACE/target/debug/yuzu" check --format json 2> "$RUNNER_TEMP/outside.err" \
            | head -1 | grep -q '^{$'
          grep -q 'config-path-outside-root\|プロジェクトルート配下ではありません' "$RUNNER_TEMP/outside.err"
          "$GITHUB_WORKSPACE/target/debug/yuzu" check --format json 2>/dev/null \
            | grep -q '"rule": "config-path-outside-root"'

  # kabosu の MSRV（rust-version = 1.85）でのコンパイル可能性。
  # 公開ライブラリなので stable より古い固定版でも check が通ることを縛る
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # 1.85
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: check (kabosu, MSRV)
        run: cargo check -p kabosu
