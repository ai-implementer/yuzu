# 依存の更新 PR（Phase 82）。1 人の運用で PR が溜まらないよう、月次で組にまとめる。
# PR が来たときの追随作業の見分け方は dependency-update スキル。
#
# 組に入れるのは minor・patch の更新だけにする。major の更新（similar 2 → 3・toml 0.9 → 1.1 等）は
# 1 本ずつの PR になり、API の変更で 1 つが壊れても組のほかの更新を止めない（最初の実行で、
# 16 個の組が major 2 つのコンパイルエラーで丸ごと止まった）。0.x の版上げ（tokio-tungstenite
# 0.29 → 0.30）も major と数えられ、組から外れる（10-10 の再実行で確認）
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: deps
    ignore:
      # wasm-bindgen-cli と完全に同じ版で検索の wasm を作り直す必要がある（Cargo.toml で `=` 固定）。
      # 上げるときは vendor-update スキルの手順で手動
      - dependency-name: wasm-bindgen
    groups:
      # 本文 HTML が変わりうる依存。スナップショットの確認と CACHE_FORMAT_VERSION の bump が
      # 要るので、ほかの依存のマージを止めないよう別の PR にする（組は上から順に当てはめる）
      render-output:
        patterns:
          - comrak
          - syntect
          - two-face
        update-types:
          - minor
          - patch
      cargo:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # actions はフルコミット SHA でピン留めしたまま、SHA と版のコメントを上げてもらう。
  # 雛形 crates/yuzu-cli/scaffold/deploy.yml は対象外なので、PR のブランチで同じ SHA に揃える
  # （ci.yml の scaffold actions pins が食い違いを止める）
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
