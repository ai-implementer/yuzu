# cargo-about の設定（第三者ライセンスの一覧を作る。scripts/third-party-licenses.sh が使う）
#
# 対象は 2 つ:
#   - バイナリ（yuzu-cli のネイティブの通常依存）→ リリースのアーカイブの THIRD-PARTY-LICENSES
#   - 検索 wasm（mikan-wasm の wasm32 向けの通常依存）→ dist の _search/THIRD-PARTY-LICENSES.txt
# ターゲットは呼び出し側が --target で渡す（バイナリは配布する 4 つ、wasm は wasm32）。

# 使ってよいライセンス（SPDX）。新しいライセンスの crate が入ったら、配布できるかを
# 確かめてからここへ足す（足さないと生成が失敗する）
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "BSL-1.0",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "Unicode-DFS-2016",
]

# 配布物に入らない依存は数えない
ignore-build-dependencies = true
ignore-dev-dependencies = true
# yuzu 自身の crate（publish = false）は第三者ではない
private = { ignore = true }

# --- crate にライセンスのファイルはあるのに、cargo-about が本文を認識できないもの ---
# 認識できないと SPDX の雛形（著作権表示が `<year> <copyright holders>`）に戻ってしまう
# （PR #31 のレビュー指摘）。ファイルの sha256 で固定して、そのファイルの本文を使わせる。
# crate の版が上がってファイルが変わると checksum が合わなくなり、生成が失敗して知らせる。
# crate に本文そのものが無いものは supplements.tsv で補う。
# 設定はバイナリと検索 wasm で共有しているので、wasm の生成ではここの crate が依存に無く
# 「config found for a crate not present in the graph」の警告が出る（問題ない）

# windows-rs の各 crate は字下げした license-mit を持つ（Copyright (c) Microsoft Corporation.）
[windows-link.clarify]
license = "MIT OR Apache-2.0"
[[windows-link.clarify.files]]
path = "license-mit"
license = "MIT"
checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383"

[windows-sys.clarify]
license = "MIT OR Apache-2.0"
[[windows-sys.clarify.files]]
path = "license-mit"
license = "MIT"
checksum = "c2cfccb812fe482101a8f04597dfc5a9991a6b2748266c47ac91b6a5aae15383"

[windows-targets.clarify]
license = "MIT OR Apache-2.0"
[[windows-targets.clarify.files]]
path = "license-mit"
