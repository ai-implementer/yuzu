# GitHub Pages へのデプロイ（yuzu build → Pages artifact）。
# 事前準備: リポジトリの Settings > Pages > Source を「GitHub Actions」にする。
# actions はフルコミット SHA でピン留めする（タグの書き換えによる改ざんを防ぐ）。
# 更新時は SHA とコメントのバージョンを揃えること
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SHA ピンでは ref 名からツールチェインを推定できないため toolchain の明示が必須
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: yuzu をインストール
        # `yuzu new` を実行した yuzu と同じ版に固定している（main の最新は未リリースの
        # 非互換を含みうる）。版を上げるときはこのタグを書き換える。fork を使う場合は
        # URL も差し替える。同じ版がキャッシュにあれば「インストール済み」で飛ばされる
        run: cargo install --locked --git https://github.com/ai-implementer/yuzu --tag v__YUZU_VERSION__ yuzu-cli

      - name: Pages の設定を取得
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: ビルド
        # 公開先のフル URL を渡す（--base-url は yuzu.toml の base_url 設定より優先される）。
        # フル URL だと canonical・共有カード（og:url / site.image の og:image）・
        # sitemap.xml が出て、llms.txt のリンクも絶対 URL になる。
        # base_path は user/org pages なら空・project pages なら /<リポジトリ名>。
        # configure-pages の base_url 出力は「Enforce HTTPS」が無効だと http:// を返すため
        # 使わず、スキームを https に固定して host + base_path から組み立てる。
        # 既存リポジトリのサブディレクトリ（例: docs/）に生成した場合は、このファイルを
        # リポジトリルートの .github/workflows/ へ移し、--root でプロジェクトを指定する:
        #   run: yuzu build --root docs --base-url "https://${{ steps.pages.outputs.host }}${{ steps.pages.outputs.base_path }}/"
        #   （下の upload-pages-artifact の path も docs/dist にする）
        run: yuzu build --base-url "https://${{ steps.pages.outputs.host }}${{ steps.pages.outputs.base_path }}/"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
