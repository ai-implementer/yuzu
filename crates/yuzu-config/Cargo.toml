[package]
name = "yuzu-config"
description = "yuzu の設定スキーマ（yuzu.toml）と探索・解決"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# crates.io へは公開しない（配布は GitHub Release のバイナリ + cargo install --git。README ロードマップ参照）
publish = false

[dependencies]
# 通常依存は kabosu（TOML。依存ゼロ）だけ（設計書 docs/content/development/kabosu.md
# 「境界と依存保証」）。探索・yuzu 固有スキーマ・既定値・パス解決だけをこの crate が持つ
kabosu = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
