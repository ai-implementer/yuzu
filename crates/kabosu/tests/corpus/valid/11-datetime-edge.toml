# 閏日・うるう秒・区切りとオフセットの書き分け
leap_day = 2024-02-29
leap_day_400 = 2000-02-29
leap_day_year_zero = 0000-02-29
leap_second = 1987-07-05T23:59:60Z

# 小文字の `t` 区切りも TOML 1.0 の妥当な書き方
lower_t = 1979-05-27t07:32:00

# オフセット 0 は `Z` / `+00:00` / `-00:00` のどれでも書ける（値は同じ）
utc_z = 1979-05-27T07:32:00Z
utc_plus = 1979-05-27T07:32:00+00:00
utc_minus = 1979-05-27T07:32:00-00:00
offset_half = 1979-05-27T07:32:00+09:30

# 小数秒は 9 桁まで保持する
nanos = 07:32:00.123456789

# 配列とテーブルの値としても書ける
in_array = [1979-05-27, 07:32:00]

[schedule]
start = 2026-09-06T09:00:00+09:00
end = 2026-09-06 18:00:00
