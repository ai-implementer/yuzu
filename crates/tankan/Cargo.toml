[package]
name = "tankan"
# 汎用ライブラリ（特定ツール非依存）。monorepo のまま crates.io へ公開している
# （開発はこのワークスペースで一体。repository は monorepo を指す）。
# バージョンは workspace と独立で、tankan の変更時にだけ上げて publish する
# （手順は CLAUDE.md「リリース手順」参照）
description = "Mermaid-compatible diagram text to SVG renderer in pure Rust (no I/O, wasm-ready)"
version = "0.2.1"
edition.workspace = true
# 依存が軽く 1.85 で通る（ワークスペースの 1.87 は mikan の依存の都合）。MSRV ジョブが 1.85 で検査する
rust-version = "1.85"
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["mermaid", "diagram", "svg", "flowchart", "sequence-diagram"]
categories = ["visualization", "rendering", "parser-implementations"]

# テスト用のコーパス（.mmd）とそのハーネス・スナップショットは配布物に含めない。
# 利用者には不要で、出所は tests/corpus/README.md に記録している（kabosu と同じ形）
exclude = ["tests/corpus", "tests/corpus_test.rs", "tests/snapshots"]

[dependencies]
thiserror = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
roxmltree = { workspace = true }
